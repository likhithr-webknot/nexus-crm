# Settings for the "test" profile.
spring:
  jpa:
    properties:
      # Lets a test count the SQL statements a call runs, to catch one-query-per-item loops.
      hibernate.generate_statistics: true
    hibernate:
      # Fails startup if an entity does not match the tables the migrations create.
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          google:
            # Placeholders so the app can start. The tests never contact Google.
            client-id: test-client
            client-secret: test-secret

nexus:
  fx:
    enabled: false
  auth:
    jwt:
      allow-ephemeral-key: true
